<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to Drukkit</title>
    <script>
        (function() {
            var target = 'index.html' + window.location.search + window.location.hash;
            window.location.replace(target);
        })();
    </script>
</head>
<body>
    <p>Redirecting to <a id="redirectLink" href="index.html">Drukkit</a>…</p>
    <script>
        var target = 'index.html' + window.location.search + window.location.hash;
        document.getElementById('redirectLink').href = target;
    </script>
</body>
</html>
